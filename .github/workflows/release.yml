name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, e.g. 1.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Validate version
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a valid semver"
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Stamp version into source
        run: swift scripts/sync-version.swift --source-only "${{ inputs.version }}" Resources/Info.plist

      - name: Restore plist placeholder (kept in repo)
        run: git checkout -- Resources/Info.plist

      - name: Build & test
        run: |
          swift build -c release
          swift test --disable-xctest

      - name: Package dmg
        run: make dist

      - name: Create tag & GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ inputs.version }}"
          DMG="build/QSnip-${{ inputs.version }}-macos.dmg"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release $TAG" || true
          git tag -a "$TAG" -m "QSnip $TAG"
          git push origin HEAD:main --follow-tags
          gh release create "$TAG" "$DMG" \
            --title "QSnip $TAG" \
            --notes "QSnip $TAG — macOS screenshot & annotation tool. Open the dmg and drag \`QSnip.app\` to \`Applications\`."
